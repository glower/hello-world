kind: pipeline
type: docker
name: Run backend tests

trigger:
  event:
    - pull_request
  branch:
    include:
      - main
  paths:
    include:
      - backend/**

steps:
  - name: checkout
    image: alpine/git
    commands:
      - git clone --branch ${DRONE_BRANCH} ${DRONE_REPO_LINK} .
  
  - name: setup-golang
    image: golang:1.23
    commands:
      - go version

  - name: verify-dependencies
    image: golang:1.23
    commands:
      - make backend-mod-verify

  - name: build
    image: golang:1.23
    commands:
      - make backend-build

  - name: go-vet
    image: golang:1.23
    commands:
      - make backend-vet

  - name: test
    image: golang:1.23
    commands:
      - make backend-test
